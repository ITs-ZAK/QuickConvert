name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore QuickConvert.slnx
      - run: dotnet build QuickConvert.slnx --no-restore --configuration Release
      - run: dotnet run --no-build --configuration Release --project tests/QuickConvert.Tests/QuickConvert.Tests.csproj
      - run: npm run test:extensions
      - run: npm run check:extensions
      - shell: pwsh
        run: ./tools/build-extensions.ps1
